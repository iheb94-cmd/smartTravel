
@if (isLoggedInUser()) {

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid" >

      <a class="navbar-brand">
        SmartTravel
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSmartTravel"
        aria-controls="navbarSmartTravel"
        aria-expanded="false"
        aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSmartTravel">

        <ul class="navbar-nav me-auto">

          @if (isAdmin()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/agents">
                Gestion des agents
              </a>
            </li>
          }

          @if ( isAgent()) {

            <li class="nav-item">
              <a class="nav-link" routerLink="/vols">
                Gestion des vols
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/hotels">
                Gestion des hôtels
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/circuits">
                Gestion des circuits
              </a>
            </li>

             <li class="nav-item">
              <a class="nav-link" routerLink="/offres">
                Gestion des offres
              </a>
            </li>

          }

        </ul>

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a
              class="nav-link"
              role="button"
              (click)="logout()">

              <mat-icon>logout</mat-icon>
              Déconnexion
            </a>
          </li>

        </ul>

      </div>
    </div>
  </nav>

}
